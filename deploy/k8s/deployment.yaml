apiVersion: apps/v1
kind: Deployment
metadata:
  name: loopinfer
  labels:
    app: loopinfer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loopinfer
  template:
    metadata:
      labels:
        app: loopinfer
    spec:
      containers:
        - name: loopinfer
          image: loopinfer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          command: ["python", "-m", "loopinfer", "serve", "--port", "8080"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
